name: hmis-web-production

volumes:
  production_web_traefik: {}

services:
  web:
    build:
      context: .
      dockerfile: ./compose/production/nextjs/Dockerfile
      args:
        NEXT_PUBLIC_APP_HOST: ${NEXT_PUBLIC_APP_HOST:-app.sigmahmis.com}
        NEXT_PUBLIC_MARKETING_HOST: ${NEXT_PUBLIC_MARKETING_HOST:-sigmahmis.com}
        NEXT_PUBLIC_ASSET_PREFIX: ${NEXT_PUBLIC_ASSET_PREFIX:-}
        NEXT_PUBLIC_BLOG_URL: ${NEXT_PUBLIC_BLOG_URL:-}
        NEXT_PUBLIC_DISABLE_HOST_ROUTING: ${NEXT_PUBLIC_DISABLE_HOST_ROUTING:-}
    image: hmis_web_production
    restart: unless-stopped
    init: true
    env_file:
      - ./.envs/.production/.web
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m,uid=1001,gid=1001,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 384M

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: hmis_web_production_traefik
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - production_web_traefik:/etc/traefik/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
